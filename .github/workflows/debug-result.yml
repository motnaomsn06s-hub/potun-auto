name: debug-result-page
on:
  push:
    branches: ['debug/**']
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - run: pip install beautifulsoup4
      - name: top
        shell: python
        run: |
          import urllib.request, urllib.parse, gzip, base64
          from bs4 import BeautifulSoup
          url = "https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/TodayRaceInfoTop" + ("?" + urllib.parse.urlencode({}) if {} else "")
          raw = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; OddsScopeNAR/13.3)"}), timeout=30).read()
          s = BeautifulSoup(raw, "html.parser")
          for t in s(["script", "style", "img", "noscript", "iframe"]): t.decompose()
          keep = "<html><head><meta charset='utf-8'><title>" + (s.title.string if s.title else "") + "</title></head><body>"
          keep += "".join(str(a) for a in s.find_all("a") if "RaceList" in (a.get("href") or ""))
          keep += "".join(str(t) for t in s.find_all("table") if not t.find_parent("table")) + "</body></html>"
          b = base64.b64encode(gzip.compress(keep.encode("utf-8"), 9)).decode()
          n = 3900
          print(f"::notice::LEN top {len(b)} {(len(b)+n-1)//n}")
          for i in range(0, len(b), n):
              print(f"::notice::FIX top {i//n} {b[i:i+n]}")
