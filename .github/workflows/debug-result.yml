name: debug-result-page
on:
  push:
    branches: ['debug/**']
jobs:
  today:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shot
        run: |
          pip install -q pillow
          B=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          python3 scripts_stub_server.py & sleep 2
          curl -s -m 90 -o /dev/null -w "%{http_code}\n" "http://127.0.0.1:8765/api/day"
          "$B" --headless=new --no-sandbox --hide-scrollbars --force-device-scale-factor=1 --window-size=390,1700 --virtual-time-budget=20000 --screenshot=/tmp/full.png "http://127.0.0.1:8765/"
          python3 -c "from PIL import Image;im=Image.open('/tmp/full.png').convert('RGB');im.save('/tmp/shot.jpg',quality=50,optimize=True)"
          python3 -c "import base64;b=base64.b64encode(open('/tmp/shot.jpg','rb').read()).decode();open('/tmp/b64','w').write(b);print('::notice::LEN today',len(b))"

      - name: c0
        run: python3 -c "b=open('/tmp/b64').read();n=3900;[print('::notice::IMG today',i,b[i*n:(i+1)*n]) for i in range(0,9) if i*n<len(b)]" 
      - name: c1
        run: python3 -c "b=open('/tmp/b64').read();n=3900;[print('::notice::IMG today',i,b[i*n:(i+1)*n]) for i in range(9,18) if i*n<len(b)]" 
      - name: c2
        run: python3 -c "b=open('/tmp/b64').read();n=3900;[print('::notice::IMG today',i,b[i*n:(i+1)*n]) for i in range(18,27) if i*n<len(b)]" 
      - name: c3
        run: python3 -c "b=open('/tmp/b64').read();n=3900;[print('::notice::IMG today',i,b[i*n:(i+1)*n]) for i in range(27,36) if i*n<len(b)]" 
