name: debug-result-page
on:
  push:
    branches: ['debug/**']
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import urllib.request, urllib.parse, gzip, base64
          B = "https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/"
          pages = {
            "top": ("TodayRaceInfoTop", {}),
            "racelist_urawa": ("RaceList", {"k_raceDate": "2026/10/20", "k_babaCode": "18"}),
            "racelist_morioka": ("RaceList", {"k_raceDate": "2026/10/20", "k_babaCode": "10"}),
            "result_urawa5": ("RaceMarkTable", {"k_raceDate": "2026/10/20", "k_babaCode": "18", "k_raceNo": "5"}),
            "result_urawa4": ("RaceMarkTable", {"k_raceDate": "2026/10/20", "k_babaCode": "18", "k_raceNo": "4"}),
            "odds_urawa5_final": ("OddsTanFuku", {"k_raceDate": "2026/10/20", "k_babaCode": "18", "k_raceNo": "5"}),
          }
          for name, (path, q) in pages.items():
              url = B + path + ("?" + urllib.parse.urlencode(q) if q else "")
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; OddsScopeNAR/13.3)"})
              raw = urllib.request.urlopen(req, timeout=30).read()
              b = base64.b64encode(gzip.compress(raw, 9)).decode()
              for i in range(0, len(b), 50000):
                  print(f"::notice::FIX {name} {i//50000} {b[i:i+50000]}")
