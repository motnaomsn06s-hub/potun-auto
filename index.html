<!doctype html><html lang=ja><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ODDS SIGNAL | NAR Odds Intelligence System</title><style>
*{box-sizing:border-box}body{margin:0;background:#07101d;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.w{max-width:760px;margin:auto;padding:14px 14px 36px}.brand{padding:8px 2px 10px}.brand h1{margin:0;font-size:29px;letter-spacing:.08em;line-height:1}
.brand .sub{margin-top:6px;font-size:11px;letter-spacing:.16em;color:#d8ae55;font-weight:800}.brand .ver{float:right;color:#718198;letter-spacing:0;font-weight:600}
.c{background:#101b2b;border:1px solid #26364b;border-radius:14px;padding:13px;margin:10px 0;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.c>b{display:block;margin-bottom:10px;font-size:14px}.row{display:grid;grid-template-columns:1.35fr 1fr .72fr 1fr;gap:7px}
input,select,button{min-width:0;width:100%;padding:11px 9px;border:1px solid #354862;border-radius:9px;background:#091525;color:#fff;font-size:14px}
button{grid-column:1/-1;background:#e6b94f;color:#16120a;border:0;font-weight:900;font-size:15px}.m{font-size:11px;color:#95a6bd;line-height:1.45}
#msg{margin:9px 2px 0}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.slots .box{text-align:center;min-height:70px}
.box{background:#091525;border:1px solid #1c2b3e;padding:10px;border-radius:11px}.ok{color:#73d79a;font-weight:800}.top{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.top .box{text-align:center;border-color:#3a3424}.top b{font-size:15px}.num{font-size:30px;line-height:1.05;color:#e8b94d;font-weight:950;margin:5px 0}
details{background:#101b2b;border:1px solid #26364b;border-radius:14px;margin:10px 0}summary{padding:13px;font-weight:800;cursor:pointer}
details>div{padding:0 13px 13px}.statusline{display:flex;align-items:center;justify-content:space-between;gap:8px}.badge{font-size:10px;color:#7f90a8}
@media(max-width:520px){.w{padding:12px}.brand h1{font-size:27px}.row{grid-template-columns:1.35fr 1fr}.row input,.row select{font-size:13px}.slots,.top{gap:5px}.box{padding:9px 5px}.top b{font-size:14px}.num{font-size:28px}}
</style></head><body><div class=w>
<div class="brand"><h1>ODDS SIGNAL</h1><div class="sub">NAR MARKET INTELLIGENCE <span class="ver">v0.7</span></div></div><div class=c><div class=row><input id=d type=date><select id=b><option value=3>帯広</option><option value=10>盛岡</option><option value=11>水沢</option><option value=18>浦和</option><option value=19>船橋</option><option value=20>大井</option><option value=21>川崎</option><option value=22>金沢</option><option value=23>笠松</option><option value=24>名古屋</option><option value=27>園田</option><option value=28>姫路</option><option value=31>高知</option><option value=36>門別</option><option value=55>佐賀</option></select><select id=r></select><input id=t type=time><button id=go>予約</button></div><p id=msg class=m>発走時刻を入力</p></div>
<div class=c><div class="statusline"><b>LIVE SNAPSHOTS</b><span class="badge">15 → 10 → 5 MIN</span></div><div class=slots><div class=box>15分前<div id=s15 class=m>未取得</div></div><div class=box>10分前<div id=s10 class=m>未取得</div></div><div class=box>5分前<div id=s5 class=m>未取得</div></div></div></div>
<div class=c><div class="statusline"><b>FINAL SIGNALS</b><span class="badge">5 MIN LOCK</span></div><div id=top class=top><span class=m>3時点待ち</span></div></div>
<details><summary>RESULT</summary><div><div id=result class=m>未取得</div></div></details>
<details><summary>DATA / VALIDATION</summary><div><div id=learn class=m>集計待ち</div></div></details></div>
<script>
const $=x=>document.getElementById(x);$('d').value=new Date().toISOString().slice(0,10);for(let i=1;i<=12;i++)$('r').innerHTML+=`<option value=${i}>${i}R</option>`;let K=localStorage.getItem("potun:v07");
async function refresh(){if(!K)return;try{await fetch("/api/tick",{method:"POST",cache:"no-store"})}catch(e){}let j=await(await fetch("/api/status?race_key="+encodeURIComponent(K),{cache:"no-store"})).json();[15,10,5].forEach(s=>{$("s"+s).innerHTML=j.snaps[String(s)]?'<span class=ok>保存済</span><br>'+j.snaps[String(s)].fetched_at:"未取得"});$('top').innerHTML=j.predictions.length?j.predictions.map(x=>`<div class=box><b>${x.rank}位 ${x.horse}番</b><div class=num>${Math.round(x.score)}</div><div>${x.pop}人気 ${x.odds}倍</div></div>`).join(""):'<span class=m>3時点待ち</span>';$('result').textContent=j.result?`確定 ${j.result.first_horse}-${j.result.second_horse}-${j.result.third_horse}`:"未取得";let L=await(await fetch("/api/learning",{cache:"no-store"})).json();$('learn').innerHTML=`完了レース ${L.completed_races}<br>候補数 ${L.predictions}<br>3着内 ${L.top3_hits}<br>候補3着内率 ${L.top3_rate==null?"未集計":(L.top3_rate*100).toFixed(1)+"%"}`}
$('go').onclick=async()=>{if(!$('t').value)return;$('msg').textContent="予約中…";let o=$('b').options[$('b').selectedIndex],iso=$('d').value+"T"+$('t').value+":00+09:00";try{let q=await fetch("/api/reserve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({date:$('d').value,baba:$('b').value,baba_name:o.text,race:Number($('r').value),start_iso:iso})});let j=await q.json();if(!q.ok||!j.ok)throw Error(j.error);K=j.race_key;localStorage.setItem("potun:v07",K);$('msg').innerHTML='<span class=ok>予約完了</span> '+o.text+" "+$('r').value+"R "+$('t').value;refresh()}catch(e){$('msg').textContent="予約失敗："+e.message}}
refresh();setInterval(refresh,30000);
</script></body></html>
