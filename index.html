<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ODDS SIGNAL</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07101d;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:760px;margin:auto;padding:14px}.brand h1{margin:8px 0 0;font-size:29px;letter-spacing:.08em}.sub{font-size:11px;letter-spacing:.15em;color:#d8ae55;font-weight:800}.ver{float:right;color:#718198}.c,.race{background:#101b2b;border:1px solid #26364b;border-radius:14px;padding:13px;margin:10px 0}.row{display:grid;grid-template-columns:1.35fr 1fr .72fr 1fr;gap:7px}input,select,button{width:100%;padding:11px 8px;border:1px solid #354862;border-radius:9px;background:#091525;color:#fff}.reserve{grid-column:1/-1;background:#e6b94f;color:#17120a;font-weight:900;border:0}.m{font-size:11px;color:#95a6bd}.ok{color:#73d79a;font-weight:800}.head{display:flex;justify-content:space-between;gap:8px}.title{font-weight:900;font-size:16px}.chips{display:flex;gap:5px;margin:8px 0;flex-wrap:wrap}.chip{font-size:10px;padding:4px 7px;border:1px solid #34465e;border-radius:999px}.done{color:#73d79a;border-color:#315944}.stage{font-size:12px;line-height:1.7;border-top:1px solid #1d2d41;padding-top:7px;margin-top:7px}.stage b{color:#e8b94d}.actions{display:flex;gap:6px;margin-top:8px}.actions button{font-size:12px;padding:8px}.view{background:#233650}.cancel{background:#311c24;color:#eaa}.slots,.top{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.box{background:#091525;border:1px solid #1c2b3e;padding:9px 5px;border-radius:10px;text-align:center}.num{font-size:28px;color:#e8b94d;font-weight:950}.badge{font-size:10px;color:#7f90a8}#detail{display:none}details{background:#101b2b;border:1px solid #26364b;border-radius:14px;margin:10px 0}summary{padding:13px;font-weight:800}details>div{padding:0 13px 13px}@media(max-width:520px){.row{grid-template-columns:1.35fr 1fr}}</style></head>
<body><div class="w"><div class="brand"><h1>ODDS SIGNAL</h1><div class="sub">NAR MARKET INTELLIGENCE <span class="ver">Ver.9.1 PARSER FIX · SUPABASE</span></div></div>
<div class="c"><div class="row"><input id="d" type="date"><select id="b"><option value="3">帯広</option><option value="10">盛岡</option><option value="11">水沢</option><option value="18">浦和</option><option value="19">船橋</option><option value="20">大井</option><option value="21">川崎</option><option value="22">金沢</option><option value="23">笠松</option><option value="24">名古屋</option><option value="27">園田</option><option value="28">姫路</option><option value="31">高知</option><option value="36">門別</option><option value="55">佐賀</option></select><select id="r"></select><input id="t" type="time"><button id="go" class="reserve">予約を追加</button></div><p id="msg" class="m">複数レースを続けて予約できます（発走16分前まで）</p></div>
<div class="c"><div class="head"><b>RESERVED RACES</b><span class="badge">15 → 10 → 5 → FINAL</span></div><div id="list" class="m">読み込み中…</div></div>
<div id="detail"><div class="c"><div class="head"><b id="dt">LIVE SIGNALS</b><span class="badge">TIME SERIES</span></div><div class="slots"><div class="box">15分前<div id="s15" class="m">未取得</div></div><div class="box">10分前<div id="s10" class="m">未取得</div></div><div class="box">5分前<div id="s5" class="m">未取得</div></div></div></div><div class="c"><b>FINAL SIGNALS</b><div id="top" class="top"><span class="m">3時点待ち</span></div></div><details><summary>RESULT</summary><div id="result" class="m">未取得</div></details></div>
<details><summary>DATA / VALIDATION</summary><div id="learn" class="m">集計待ち</div></details></div>
<script>
const $=x=>document.getElementById(x);$('d').value=new Date().toLocaleDateString('sv-SE');for(let i=1;i<=12;i++)$('r').innerHTML+=`<option value="${i}">${i}R</option>`;let cur=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function arrow(d){return d>0.05?`↑+${d.toFixed(2)}`:d<-0.05?`↓${d.toFixed(2)}`:"→"}
function picks(a,move=true){return a&&a.length?a.map((x,i)=>`<b>${x.horse}番 ${Math.round(x.score)}</b>${move&&x.delta!=null?" "+arrow(x.delta):""}${i<2?" / ":""}`).join(""):"－"}
function chip(n,s){return `<span class="chip ${s.includes(n)?"done":""}">${n}分 ${s.includes(n)?"✓":"－"}</span>`}
async function load(){try{let j=await(await fetch("/api/races",{cache:"no-store"})).json(),a=j.races;$('list').innerHTML=a.length?a.map(x=>`<div class="race"><div class="head"><div><div class="title">${esc(x.baba_name)} ${x.race}R</div><span class="m">${x.date}　${x.start_iso.slice(11,16)}</span></div><span class="badge">${x.status}</span></div><div class="chips">${chip(15,x.slots)}${chip(10,x.slots)}${chip(5,x.slots)}</div><div class="stage">15分：${picks(x.stages["15"],false)}<br>10分：${picks(x.stages["10"])}<br>5分：${picks(x.stages["5"])}</div><div class="actions"><button class="view" onclick='show(${JSON.stringify(x.race_key)})'>詳細</button><button class="cancel" onclick='cancelR(${JSON.stringify(x.race_key)})'>取消</button></div></div>`).join(""):"予約中のレースはありません"}catch(e){$('list').textContent="一覧取得失敗："+e.message}}
async function show(k){cur=k;let j=await(await fetch("/api/status?race_key="+encodeURIComponent(k),{cache:"no-store"})).json();$('detail').style.display="block";$('dt').textContent=j.race.baba_name+" "+j.race.race+"R LIVE SIGNALS";[15,10,5].forEach(n=>{$("s"+n).innerHTML=j.stages[String(n)]?picks(j.stages[String(n)]):"未取得"});$('top').innerHTML=j.predictions.length?j.predictions.map(x=>`<div class="box"><b>${x.rank}位 ${x.horse}番</b><div class="num">${Math.round(x.score)}</div><div>${x.strength}</div><div class="m">${x.pop}人気 ${x.odds}倍　${x.finish?x.finish+"着":(j.result?"着外":"結果待ち")}</div></div>`).join(""):(j.snaps["15"]&&j.snaps["10"]&&j.snaps["5"]?'<span class="m">3時点取得済み・FINAL再計算待ち</span>':'<span class="m">3時点待ち</span>');$('result').textContent=j.result?`確定 ${j.result.first_horse}-${j.result.second_horse}-${j.result.third_horse}`:"未取得";$('detail').scrollIntoView({behavior:"smooth"})}
async function cancelR(k){if(!confirm("この予約を取り消しますか？"))return;await fetch("/api/cancel",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({race_key:k})});if(cur===k)$('detail').style.display="none";load()}
$('go').onclick=async()=>{if(!$('t').value){$('msg').textContent="発走時刻を入力してください";return}let o=$('b').options[$('b').selectedIndex],iso=$('d').value+"T"+$('t').value+":00+09:00";let q=await fetch("/api/reserve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({date:$('d').value,baba:$('b').value,baba_name:o.text,race:+$('r').value,start_iso:iso})});let j=await q.json();$('msg').innerHTML=j.ok?'<span class="ok">予約完了</span>　続けて予約できます':"予約失敗："+j.error;load()}
async function learn(){try{let x=await(await fetch("/api/learning",{cache:"no-store"})).json();let st=x.model_status==="ACTIVE"?`学習モデル v${x.model_version} 稼働中`:x.model_status==="KEEP_HEURISTIC"?"新モデル不採用・現行ロジック維持":`学習待ち（${x.learning_races}/${x.min_train_races}レース）`;let val=(x.heuristic_val!=null&&x.learned_val!=null)?`<br>検証：現行 ${(x.heuristic_val*100).toFixed(1)}% / 学習 ${(x.learned_val*100).toFixed(1)}%`:"";$('learn').innerHTML=`完了レース ${x.completed_races}<br>学習データ ${x.learning_races}レース / ${x.learning_samples}頭<br>候補数 ${x.predictions}　3着内 ${x.top3_hits}<br>候補3着内率 ${x.top3_rate==null?"未集計":(x.top3_rate*100).toFixed(1)+"%"}<br><b>${st}</b>${val}`}catch(e){}}
load();learn();setInterval(()=>{load();learn();if(cur)show(cur)},30000);
</script></body></html>
