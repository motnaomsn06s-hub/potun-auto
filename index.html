<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地方ポツン AUTO</title><style>body{margin:0;background:#08111f;color:#eef4ff;font-family:-apple-system,sans-serif}.w{max-width:900px;margin:auto;padding:22px}.c{background:#111c2e;border:1px solid #273650;border-radius:16px;padding:16px;margin:14px 0}.row{display:flex;gap:9px;flex-wrap:wrap}input,select,button{padding:12px;border-radius:10px;border:1px solid #33445f;background:#091525;color:white}button{background:#e8b94d;color:#171207;font-weight:800}.top{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.s{background:#091525;border-radius:13px;padding:15px}.n{font-size:32px;color:#e8b94d;font-weight:900}.m{color:#9aabc2;font-size:12px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #273650;text-align:right}td:first-child,th:first-child{text-align:left}@media(max-width:650px){.top{grid-template-columns:1fr}}</style></head><body><div class="w"><h1>地方ポツン AUTO <small>v0.2</small></h1><p class="m">NARオッズ自動取得 → 歪み解析 → ポツン候補TOP3</p><div class="c"><div class="row"><input id="date" type="date"><select id="baba"><option value="3">帯広</option><option value="10">盛岡</option><option value="11">水沢</option><option value="18">浦和</option><option value="19">船橋</option><option value="20">大井</option><option value="21">川崎</option><option value="22">金沢</option><option value="23">笠松</option><option value="24">名古屋</option><option value="27">園田</option><option value="28">姫路</option><option value="31">高知</option><option value="36">門別</option><option value="55">佐賀</option></select><select id="race"></select><button onclick="go()">自動取得・解析</button></div><p id="status" class="m">レースを選んで押してください。</p></div><div class="c"><b>ポツン候補 TOP3</b><div id="top" class="top"></div></div><div class="c"><b>全馬スコア</b><div id="out"></div></div></div><script>date.value=new Date().toISOString().slice(0,10);for(let i=1;i<=12;i++)race.innerHTML+=`<option value="${i}">${i}R</option>`;async function go(){status.textContent='NARから取得中…';top.innerHTML='';out.innerHTML='';try{let u=`/api/analyze?date=${date.value}&baba=${baba.value}&race=${race.value}`,j=await(await fetch(u)).json();if(j.error)throw Error(j.error);status.textContent=`取得完了：単勝 ${j.counts.win} / 馬連 ${j.counts.quinella} / 馬単 ${j.counts.exacta} / 三連単 ${j.counts.trifecta}`;top.innerHTML=j.rows.slice(0,3).map((x,i)=>`<div class=s>${i+1}位　<b>${x.horse}番</b><div class=n>${x.score}</div><div class=m>三連単 ${x.T.toFixed(2)} / 馬単 ${x.E.toFixed(2)} / 馬連 ${x.Q.toFixed(2)}</div></div>`).join('');out.innerHTML='<table><tr><th>馬番</th><th>指数</th><th>三連単</th><th>馬単</th><th>馬連</th></tr>'+j.rows.map(x=>`<tr><td>${x.horse}</td><td><b>${x.score}</b></td><td>${x.T.toFixed(2)}</td><td>${x.E.toFixed(2)}</td><td>${x.Q.toFixed(2)}</td></tr>`).join('')+'</table>'}catch(e){status.textContent='取得失敗：'+e.message}}</script></body></html>
