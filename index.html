<!doctype html><html lang=ja><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>地方ポツン AUTO v0.7</title><style>
body{margin:0;background:#08111f;color:#eef4ff;font-family:-apple-system,sans-serif}.w{max-width:900px;margin:auto;padding:20px}.c{background:#111c2e;border:1px solid #293952;border-radius:16px;padding:16px;margin:13px 0}.row{display:flex;gap:8px;flex-wrap:wrap}input,select,button{padding:12px;border:1px solid #354862;border-radius:10px;background:#091525;color:#fff}button{background:#e8b94d;color:#171207;font-weight:800}.m{font-size:12px;color:#9aabc2;line-height:1.6}.slots,.top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{background:#091525;padding:13px;border-radius:12px}.ok{color:#76d69a}.num{font-size:30px;color:#e8b94d;font-weight:900}@media(max-width:650px){.slots,.top{grid-template-columns:1fr}}</style></head><body><div class=w>
<h1>地方ポツン AUTO v0.7</h1><p class=m>15・10・5分前保存 → 5分前候補固定 → 結果照合 → 検証データ蓄積</p>
<div class=c><div class=row><input id=d type=date><select id=b><option value=3>帯広</option><option value=10>盛岡</option><option value=11>水沢</option><option value=18>浦和</option><option value=19>船橋</option><option value=20>大井</option><option value=21>川崎</option><option value=22>金沢</option><option value=23>笠松</option><option value=24>名古屋</option><option value=27>園田</option><option value=28>姫路</option><option value=31>高知</option><option value=36>門別</option><option value=55>佐賀</option></select><select id=r></select><input id=t type=time><button id=go>予約</button></div><p id=msg class=m>発走時刻を入力</p></div>
<div class=c><b>取得</b><div class=slots><div class=box>15分前<div id=s15 class=m>未取得</div></div><div class=box>10分前<div id=s10 class=m>未取得</div></div><div class=box>5分前<div id=s5 class=m>未取得</div></div></div></div>
<div class=c><b>固定候補 TOP3</b><div id=top class=top><span class=m>3時点待ち</span></div></div>
<div class=c><b>結果</b><div id=result class=m>未取得</div></div>
<div class=c><b>蓄積・検証</b><div id=learn class=m>集計待ち</div></div></div>
<script>
const $=x=>document.getElementById(x);$('d').value=new Date().toISOString().slice(0,10);for(let i=1;i<=12;i++)$('r').innerHTML+=`<option value=${i}>${i}R</option>`;let K=localStorage.getItem("potun:v07");
async function refresh(){if(!K)return;try{await fetch("/api/tick",{method:"POST",cache:"no-store"})}catch(e){}let j=await(await fetch("/api/status?race_key="+encodeURIComponent(K),{cache:"no-store"})).json();[15,10,5].forEach(s=>{$("s"+s).innerHTML=j.snaps[String(s)]?'<span class=ok>保存済</span><br>'+j.snaps[String(s)].fetched_at:"未取得"});$('top').innerHTML=j.predictions.length?j.predictions.map(x=>`<div class=box><b>${x.rank}位 ${x.horse}番</b><div class=num>${Math.round(x.score)}</div><div>${x.pop}人気 ${x.odds}倍</div></div>`).join(""):'<span class=m>3時点待ち</span>';$('result').textContent=j.result?`確定 ${j.result.first_horse}-${j.result.second_horse}-${j.result.third_horse}`:"未取得";let L=await(await fetch("/api/learning",{cache:"no-store"})).json();$('learn').innerHTML=`完了レース ${L.completed_races}<br>候補数 ${L.predictions}<br>3着内 ${L.top3_hits}<br>候補3着内率 ${L.top3_rate==null?"未集計":(L.top3_rate*100).toFixed(1)+"%"}`}
$('go').onclick=async()=>{if(!$('t').value)return;$('msg').textContent="予約中…";let o=$('b').options[$('b').selectedIndex],iso=$('d').value+"T"+$('t').value+":00+09:00";try{let q=await fetch("/api/reserve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({date:$('d').value,baba:$('b').value,baba_name:o.text,race:Number($('r').value),start_iso:iso})});let j=await q.json();if(!q.ok||!j.ok)throw Error(j.error);K=j.race_key;localStorage.setItem("potun:v07",K);$('msg').innerHTML='<span class=ok>予約完了</span> '+o.text+" "+$('r').value+"R "+$('t').value;refresh()}catch(e){$('msg').textContent="予約失敗："+e.message}}
refresh();setInterval(refresh,30000);
</script></body></html>
