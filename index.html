<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>地方ポツン AUTO v0.4</title>
<style>
body{margin:0;background:#08111f;color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.w{max-width:900px;margin:auto;padding:22px}.c{background:#111c2e;border:1px solid #273650;border-radius:16px;padding:16px;margin:14px 0}
.row{display:flex;gap:9px;flex-wrap:wrap}input,select,button{padding:12px;border-radius:10px;border:1px solid #33445f;background:#091525;color:white}
button{background:#e8b94d;color:#171207;font-weight:800}.topgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.s{background:#091525;border-radius:13px;padding:15px}.n{font-size:32px;color:#e8b94d;font-weight:900}.m{color:#9aabc2;font-size:12px;line-height:1.55}
.badge{display:inline-block;border:1px solid #40516b;border-radius:999px;padding:3px 8px;margin:3px 3px 0 0;font-size:11px}
.warn{color:#f0cc77}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px;border-bottom:1px solid #273650;text-align:right;white-space:nowrap}
td:first-child,th:first-child{text-align:left}.scroll{overflow-x:auto}
@media(max-width:650px){.topgrid{grid-template-columns:1fr}}
</style></head>
<body><div class="w">
<h1>地方ポツン AUTO <small>v0.4 FIX</small></h1>
<p class="m">NAR公開オッズ自動取得 → 市場間の歪み解析。<b>異常スコアは的中確率ではありません。</b></p>

<div class="c"><div class="row">
<input id="raceDate" type="date">
<select id="baba"><option value="3">帯広</option><option value="10">盛岡</option><option value="11">水沢</option><option value="18">浦和</option><option value="19">船橋</option><option value="20">大井</option><option value="21">川崎</option><option value="22">金沢</option><option value="23">笠松</option><option value="24">名古屋</option><option value="27">園田</option><option value="28">姫路</option><option value="31">高知</option><option value="36">門別</option><option value="55">佐賀</option></select>
<select id="raceNo"></select><button id="runBtn">自動取得・解析</button>
</div><p id="statusText" class="m">レースを選んで押してください。</p></div>

<div class="c"><b>ポツン候補 TOP3</b>
<p class="m">固定条件：異常スコア70以上 ＋ 3市場中2市場以上で正の異常。条件未達なら「該当なし」。</p>
<div id="topCandidates" class="topgrid"></div></div>

<div class="c"><b>取得した単勝オッズ</b><div id="winData" class="m">未取得</div></div>

<div class="c"><b>全馬・異常スコア</b>
<p class="m">50前後＝レース内の通常域、84前後＝約+1SD、98前後＝約+2SDの目安。100点を機械的に作るmin-max方式は廃止。</p>
<div id="allRows" class="scroll"></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
$('raceDate').value=new Date().toISOString().slice(0,10);
for(let i=1;i<=12;i++) $('raceNo').innerHTML+=`<option value="${i}">${i}R</option>`;

function esc(v){return String(v).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function marketText(x){return `三連単 ${x.T.toFixed(2)} / 馬単 ${x.E.toFixed(2)} / 馬連 ${x.Q.toFixed(2)}`}

async function go(){
 const status=$('statusText'), topBox=$('topCandidates'), out=$('allRows'), win=$('winData');
 status.textContent='NARから取得中…'; topBox.innerHTML=''; out.innerHTML=''; win.textContent='取得中…';
 try{
   const u=`/api/analyze?date=${encodeURIComponent($('raceDate').value)}&baba=${encodeURIComponent($('baba').value)}&race=${encodeURIComponent($('raceNo').value)}`;
   const res=await fetch(u,{cache:'no-store'}); const j=await res.json();
   if(!res.ok || j.error) throw Error(j.error || `HTTP ${res.status}`);
   status.textContent=`取得完了 ${j.fetched_at}：単勝 ${j.counts.win} / 馬連 ${j.counts.quinella} / 馬単 ${j.counts.exacta} / 三連単 ${j.counts.trifecta}`;

   win.innerHTML=j.win_odds.map((x,i)=>`<span class="badge">${i+1}人気 ${x.horse}番 ${x.odds.toFixed(1)}倍</span>`).join('');

   if(j.candidates.length===0){
     topBox.innerHTML='<div class="s"><b>該当なし</b><div class="m">固定条件を満たす異常集中は検出されませんでした。</div></div>';
   }else{
     topBox.innerHTML=j.candidates.map((x,i)=>`<div class="s"><b>${i+1}位　${esc(x.horse)}番</b>
       <div class="n">${x.score}</div>
       <div>${x.popularity}人気・単勝 ${x.win_odds.toFixed(1)}倍</div>
       <div class="m">${marketText(x)}</div>
       <div class="m">正の異常：${x.positive_markets}/3市場</div></div>`).join('');
   }

   out.innerHTML='<table><tr><th>馬番</th><th>人気</th><th>単勝</th><th>異常</th><th>市場数</th><th>三連単</th><th>馬単</th><th>馬連</th></tr>'+
     j.rows.map(x=>`<tr><td>${x.horse}</td><td>${x.popularity}</td><td>${x.win_odds.toFixed(1)}</td><td><b>${x.score}</b></td><td>${x.positive_markets}/3</td><td>${x.T.toFixed(2)}</td><td>${x.E.toFixed(2)}</td><td>${x.Q.toFixed(2)}</td></tr>`).join('')+'</table>';
 }catch(e){
   status.textContent='取得・解析失敗：'+e.message;
   topBox.innerHTML='<div class="s warn">解析を中止しました。取得不完全なデータでは候補を出しません。</div>';
   win.textContent='取得失敗';
 }
}
$('runBtn').addEventListener('click',go);
</script></body></html>
