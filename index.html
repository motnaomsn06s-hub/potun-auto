<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地方ポツン AUTO v0.5</title>
<style>body{margin:0;background:#08111f;color:#eef4ff;font-family:-apple-system,sans-serif}.w{max-width:920px;margin:auto;padding:20px}.c{background:#111c2e;border:1px solid #293952;border-radius:16px;padding:16px;margin:13px 0}.row{display:flex;gap:8px;flex-wrap:wrap}input,select,button{padding:12px;border:1px solid #354862;border-radius:10px;background:#091525;color:#fff}button{background:#e8b94d;color:#171207;font-weight:800}.m{font-size:12px;color:#9aabc2;line-height:1.6}.slots,.top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot,.pick{background:#091525;padding:13px;border-radius:12px}.ok{color:#76d69a}.wait,.num{color:#e8b94d}.num{font-size:30px;font-weight:900}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid #293952;text-align:right;white-space:nowrap}td:first-child,th:first-child{text-align:left}.scroll{overflow:auto}@media(max-width:650px){.slots,.top{grid-template-columns:1fr}}</style></head>
<body><div class="w"><h1>地方ポツン AUTO v0.5</h1><p class="m">15分前 → 10分前 → 5分前。5分前で候補を固定。画面を開いている間30秒ごとに監視します。</p>
<div class="c"><div class="row"><input id="d" type="date"><select id="b"><option value="3">帯広</option><option value="10">盛岡</option><option value="11">水沢</option><option value="18">浦和</option><option value="19">船橋</option><option value="20">大井</option><option value="21">川崎</option><option value="22">金沢</option><option value="23">笠松</option><option value="24">名古屋</option><option value="27">園田</option><option value="28">姫路</option><option value="31">高知</option><option value="36">門別</option><option value="55">佐賀</option></select><select id="r"></select><input id="start" type="time"><button id="go">監視開始</button></div><p class="m">公式発走時刻を入力してください。</p><div id="state" class="m">未開始</div></div>
<div class="c"><b>時系列スナップショット</b><div class="slots"><div class="slot"><b>15分前</b><div id="s15" class="m">待機</div></div><div class="slot"><b>10分前</b><div id="s10" class="m">待機</div></div><div class="slot"><b>5分前</b><div id="s5" class="m">待機</div></div></div></div>
<div class="c"><b>5分前 最終候補 TOP3</b><p class="m">3時点すべてが揃った場合のみ判定。10→5分で異常が強まった馬を優先。</p><div id="top" class="top"></div></div>
<div class="c"><b>全馬・時系列</b><div id="tbl" class="scroll"></div></div></div>
<script>
const $=x=>document.getElementById(x);$('d').value=new Date().toISOString().slice(0,10);for(let i=1;i<=12;i++)$('r').innerHTML+=`<option value="${i}">${i}R</option>`;
let S={15:null,10:null,5:null},timer=null,target=null;
function key(s){return`potun:${$('d').value}:${$('b').value}:${$('r').value}:${s}`}
function targetTime(){if(!$('start').value)return null;let x=new Date($('d').value+"T00:00:00");let [h,m]=$('start').value.split(":").map(Number);x.setHours(h,m,0,0);return x}
async function take(s){if(S[s])return;$('s'+s).innerHTML='<span class="wait">取得中…</span>';try{let u=`/api/snapshot?date=${$('d').value}&baba=${$('b').value}&race=${$('r').value}`;let q=await fetch(u,{cache:"no-store"}),j=await q.json();if(!q.ok||j.error)throw Error(j.error||q.status);S[s]=j;localStorage.setItem(key(s),JSON.stringify(j));$('s'+s).innerHTML=`<span class="ok">保存済</span><br>${j.fetched_at}<br>単${j.counts.win}/連${j.counts.Q}/単${j.counts.E}/3単${j.counts.T}`;render()}catch(e){$('s'+s).textContent="失敗："+e.message}}
function map(s){let o={};(S[s]?.rows||[]).forEach(x=>o[x.horse]=x);return o}
function calc(){if(!S[15]||!S[10]||!S[5])return[];let a=map(15),b=map(10),c=map(5),out=[];for(let h in c){if(!a[h]||!b[h])continue;let d1=b[h].base-a[h].base,d2=c[h].base-b[h].base,persist=[a[h].base,b[h].base,c[h].base].filter(x=>x>0).length/3,agree=[c[h].Q,c[h].E,c[h].T].filter(x=>x>0).length/3;let level=Math.tanh(Math.max(0,c[h].base)/2),accel=Math.tanh(Math.max(0,d2)/1.5);let score=Math.round(100*(.40*level+.30*accel+.15*persist+.15*agree));out.push({...c[h],d1,d2,agree,score})}return out.sort((x,y)=>y.score-x.score)}
function render(){let A=calc();if(!A.length){$('top').innerHTML="";$('tbl').innerHTML='<p class="m">3時点が揃うと表示します。</p>';return}let C=A.filter(x=>x.score>=65&&x.agree>=2/3&&x.d2>0).slice(0,3);$('top').innerHTML=C.length?C.map((x,i)=>`<div class="pick"><b>${i+1}位 ${x.horse}番</b><div class="num">${x.score}</div><div>${x.pop}人気・${x.odds.toFixed(1)}倍</div><div class="m">10→5分 Δ ${x.d2>=0?"+":""}${x.d2.toFixed(2)}<br>市場一致 ${Math.round(x.agree*3)}/3</div></div>`).join(""):'<div class="pick">該当なし</div>';$('tbl').innerHTML='<table><tr><th>馬</th><th>人気</th><th>単勝</th><th>最終</th><th>15→10</th><th>10→5</th><th>一致</th></tr>'+A.map(x=>`<tr><td>${x.horse}</td><td>${x.pop}</td><td>${x.odds.toFixed(1)}</td><td><b>${x.score}</b></td><td>${x.d1.toFixed(2)}</td><td>${x.d2.toFixed(2)}</td><td>${Math.round(x.agree*3)}/3</td></tr>`).join("")+"</table>"}
function load(){[15,10,5].forEach(s=>{let x=localStorage.getItem(key(s));if(x){S[s]=JSON.parse(x);$('s'+s).innerHTML='<span class="ok">保存済（端末）</span><br>'+S[s].fetched_at}});render()}
function tick(){let mins=(target-new Date())/60000;$('state').textContent=`監視中：発走まで約 ${mins.toFixed(1)}分`;if(mins<=15.5&&mins>=14)take(15);if(mins<=10.5&&mins>=9)take(10);if(mins<=5.5&&mins>=4)take(5)}
$('go').onclick=()=>{target=targetTime();if(!target)return alert("発走時刻を入力");S={15:null,10:null,5:null};load();if(timer)clearInterval(timer);tick();timer=setInterval(tick,30000)};load();
</script></body></html>
